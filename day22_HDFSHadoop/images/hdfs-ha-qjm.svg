<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="t d">
<title id="t">HDFS high availability with QJM, ZooKeeper and ZKFC</title><desc id="d">An Active and Standby NameNode share edits through a quorum of JournalNodes. ZKFC processes coordinate failover using ZooKeeper. DataNodes report to both NameNodes.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#506277"/></marker><style>.b{fill:#f8fafc;stroke:#506277;stroke-width:2;rx:8}.act{fill:#dff3e4;stroke:#287a3c}.std{fill:#e8f2ff;stroke:#2774ad}.jn{fill:#fff3d8;stroke:#aa7413}.zk{fill:#f1e9ff;stroke:#7445a3}.dn{fill:#edf7f0;stroke:#40844c}.x{font:600 19px Arial;fill:#17212b;text-anchor:middle}.q{font:14px Arial;fill:#465565;text-anchor:middle}.e{fill:none;stroke:#506277;stroke-width:2;marker-end:url(#a)}.bi{fill:none;stroke:#506277;stroke-width:2;marker-start:url(#a);marker-end:url(#a)}.dash{stroke-dasharray:7 5}</style></defs><rect width="1080" height="700" fill="white"/>
<rect class="b" x="430" y="20" width="220" height="62"/><text class="x" x="540" y="58">HDFS clients</text><path class="e" d="M500 82L270 145"/><path class="e dash" d="M580 82L810 145"/>
<rect class="b act" x="105" y="145" width="310" height="105"/><text class="x" x="260" y="178">NameNode A — ACTIVE</text><text class="q" x="260" y="204">serves client writes and reads</text><text class="q" x="260" y="228">writes every namespace edit to JN quorum</text>
<rect class="b std" x="665" y="145" width="310" height="105"/><text class="x" x="820" y="178">NameNode B — STANDBY</text><text class="q" x="820" y="204">tails edits and keeps namespace hot</text><text class="q" x="820" y="228">ready to become Active</text>
<rect class="b zk" x="135" y="278" width="250" height="65"/><text class="x" x="260" y="307">ZKFC A</text><text class="q" x="260" y="330">health monitor + failover controller</text><rect class="b zk" x="695" y="278" width="250" height="65"/><text class="x" x="820" y="307">ZKFC B</text><text class="q" x="820" y="330">health monitor + failover controller</text><path class="bi" d="M260 250V278"/><path class="bi" d="M820 250V278"/>
<rect class="b zk" x="390" y="380" width="300" height="78"/><text class="x" x="540" y="411">ZooKeeper ensemble</text><text class="q" x="540" y="436">active lock + coordination state</text><path class="bi" d="M385 320L445 380"/><path class="bi" d="M695 320L635 380"/>
<rect class="b jn" x="90" y="510" width="220" height="72"/><text class="x" x="200" y="540">JournalNode 1</text><text class="q" x="200" y="562">persistent edit log</text><rect class="b jn" x="430" y="510" width="220" height="72"/><text class="x" x="540" y="540">JournalNode 2</text><text class="q" x="540" y="562">persistent edit log</text><rect class="b jn" x="770" y="510" width="220" height="72"/><text class="x" x="880" y="540">JournalNode 3</text><text class="q" x="880" y="562">persistent edit log</text>
<path class="e" d="M220 250L190 510"/><path class="e" d="M250 250L515 510"/><path class="e" d="M290 250L855 510"/><path class="e dash" d="M790 250L225 510"/><path class="e dash" d="M820 250L555 510"/><path class="e dash" d="M850 250L890 510"/>
<rect class="b dn" x="160" y="625" width="220" height="55"/><text class="x" x="270" y="659">DataNodes</text><rect class="b dn" x="700" y="625" width="220" height="55"/><text class="x" x="810" y="659">block replicas</text><path class="bi dash" d="M210 625L170 250"/><path class="bi dash" d="M870 625L910 250"/><text class="q" x="540" y="615">heartbeats and block reports go to both NameNodes</text>
</svg>
