<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="t d"><title id="t">Automatic HDFS HA failover sequence</title><desc id="d">ZKFC detects Active failure, ZooKeeper lock is released, peer ZKFC fences the old Active, Standby catches up from JournalNodes, transitions Active, and clients retry.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker><style>.b{fill:#f7f9fc;stroke:#526579;stroke-width:2;rx:8}.x{font:600 16px Arial;fill:#17212b;text-anchor:middle}.q{font:13px Arial;fill:#465565;text-anchor:middle}.e{stroke:#526579;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1100" height="330" fill="white"/><text class="x" x="550" y="30">Automatic failover: ordered safety-critical sequence</text>
<g><rect class="b" x="20" y="75" width="170" height="100"/><text class="x" x="105" y="108">1. Detect</text><text class="q" x="105" y="135">ZKFC health checks</text><text class="q" x="105" y="155">Active fails</text><line class="e" x1="190" y1="125" x2="218" y2="125"/>
<rect class="b" x="220" y="75" width="170" height="100"/><text class="x" x="305" y="108">2. Elect</text><text class="q" x="305" y="135">ZooKeeper lock</text><text class="q" x="305" y="155">selects one controller</text><line class="e" x1="390" y1="125" x2="418" y2="125"/>
<rect class="b" x="420" y="75" width="170" height="100"/><text class="x" x="505" y="108">3. Fence</text><text class="q" x="505" y="135">prevent old Active</text><text class="q" x="505" y="155">from writing</text><line class="e" x1="590" y1="125" x2="618" y2="125"/>
<rect class="b" x="620" y="75" width="170" height="100"/><text class="x" x="705" y="108">4. Catch up</text><text class="q" x="705" y="135">Standby applies all</text><text class="q" x="705" y="155">committed JN edits</text><line class="e" x1="790" y1="125" x2="818" y2="125"/>
<rect class="b" x="820" y="75" width="250" height="100"/><text class="x" x="945" y="108">5. Promote and retry</text><text class="q" x="945" y="135">Standby becomes Active</text><text class="q" x="945" y="155">clients reconnect/retry</text></g>
<rect class="b" x="205" y="230" width="690" height="65"/><text class="x" x="550" y="258">Core invariant: at most one writer may act as Active</text><text class="q" x="550" y="280">Quorum epochs + fencing protect against split brain; ZooKeeper alone does not store HDFS metadata.</text></svg>
