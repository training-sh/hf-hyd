<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="t d">
<title id="t">HDFS NameNode metadata and checkpoint architecture</title><desc id="d">Clients use the NameNode for metadata and DataNodes for blocks. The SecondaryNameNode periodically merges fsimage and edits into a checkpoint.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker><style>.b{fill:#f7f9fc;stroke:#526579;stroke-width:2;rx:8}.n{fill:#e8f3ff;stroke:#2475ad}.s{fill:#fff5dd;stroke:#b37a12}.d{fill:#edf8ed;stroke:#398441}.x{font:600 20px Arial;fill:#17212b;text-anchor:middle}.q{font:15px Arial;fill:#455565;text-anchor:middle}.e{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#a)}.dash{stroke-dasharray:7 5}</style></defs>
<rect width="1000" height="590" fill="white"/><rect class="b" x="45" y="55" width="210" height="75"/><text class="x" x="150" y="88">HDFS clients</text><text class="q" x="150" y="113">open, create, list</text>
<rect class="b n" x="360" y="35" width="280" height="130"/><text class="x" x="500" y="70">Active NameNode</text><text class="q" x="500" y="98">in-memory namespace</text><text class="q" x="500" y="122">file → block mapping</text><text class="q" x="500" y="146">permissions and policies</text>
<path class="e" d="M255 78H360"/><text class="q" x="307" y="66">metadata RPC</text>
<rect class="b" x="735" y="32" width="215" height="62"/><text class="x" x="842" y="70">fsimage</text><rect class="b" x="735" y="110" width="215" height="62"/><text class="x" x="842" y="148">edits</text><path class="e" d="M640 75H735"/><path class="e" d="M640 125H735"/>
<rect class="b d" x="70" y="310" width="210" height="100"/><text class="x" x="175" y="345">DataNode 1</text><text class="q" x="175" y="374">block replicas</text><text class="q" x="175" y="396">heartbeats/reports</text><rect class="b d" x="395" y="310" width="210" height="100"/><text class="x" x="500" y="345">DataNode 2</text><text class="q" x="500" y="374">block replicas</text><text class="q" x="500" y="396">heartbeats/reports</text><rect class="b d" x="720" y="310" width="210" height="100"/><text class="x" x="825" y="345">DataNode 3</text><text class="q" x="825" y="374">block replicas</text><text class="q" x="825" y="396">heartbeats/reports</text>
<path class="e" d="M145 130L165 310"/><text class="q" x="115" y="230">block I/O</text><path class="e dash" d="M445 165L195 310"/><path class="e dash" d="M500 165V310"/><path class="e dash" d="M555 165L805 310"/><text class="q" x="630" y="225">commands / reports</text>
<rect class="b s" x="305" y="475" width="390" height="85"/><text class="x" x="500" y="510">SecondaryNameNode / CheckpointNode</text><text class="q" x="500" y="538">downloads fsimage + edits, merges, uploads checkpoint</text><path class="e dash" d="M790 172L610 475"/><path class="e dash" d="M390 475L760 172"/>
</svg>
